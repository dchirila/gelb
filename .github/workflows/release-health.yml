name: Release health

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  release-health:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ gfortran libnetcdf-dev libnetcdff-dev
          # Qt (the gelb-view tests, offscreen) loads the GL libraries
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1

      - name: Install project
        run: uv sync --all-extras

      - name: Build package artifacts
        run: uv build --wheel --sdist

      - name: Smoke installed wheel
        # As a user of a pip installation sees it: from a directory outside
        # the checkout, with uv off the PATH and GELB_PYTHON unset.
        run: |
          python -m venv /tmp/gelb-wheel
          /tmp/gelb-wheel/bin/python -m pip install --upgrade pip
          /tmp/gelb-wheel/bin/python -m pip install dist/*.whl
          mkdir -p /tmp/gelb-smoke
          cp examples/basic/1d/ex0_int_vec_setto_one.gelb /tmp/gelb-smoke/
          cd /tmp/gelb-smoke
          env -u GELB_PYTHON PATH=/usr/bin:/bin bash -eo pipefail -c '
            /tmp/gelb-wheel/bin/python -c "import gelb; print(gelb.__file__)" | grep -F /tmp/gelb-wheel/
            /tmp/gelb-wheel/bin/gelbc --version | grep -E "^gelbc [0-9]"
            /tmp/gelb-wheel/bin/gelbc ex0_int_vec_setto_one.gelb --diagnostics-json
            /tmp/gelb-wheel/bin/gelb-run -b cpu_fortran_serial -n 1 ex0_int_vec_setto_one.gelb
            test -s ex0_int_vec_setto_one.nc
            ! /tmp/gelb-wheel/bin/gelb-run -n 1 ex0_int_vec_setto_one.gelb 2> highway.err
            grep -F "this installation has no Highway" highway.err'

      - name: Run focused tests
        run: |
          uv run pytest \
            gelb/tests/integration/test_example_diagnostics.py \
            gelb/tests/integration/test_geometry_lint.py \
            gelb/tests/integration/test_cbt_guard.py \
            gelb/tests/integration/test_view_colorbar.py \
            gelb/tests/integration/test_view_context_menu.py \
            gelb/tests/integration/test_view_layout.py \
            gelb/tests/integration/test_view_composite_cmap.py \
            gelb/tests/integration/test_view_integer_fields.py \
            gelb/tests/integration/test_gelb_run_guards.py \
            gelb/tests/integration/test_cli_entry_points.py \
            gelb/tests/integration/test_gelbc_output_paths.py \
            gelb/tests/integration/test_gelb_run_flag_overrides.py \
            gelb/tests/integration/test_define_diagnostics.py \
            gelb/tests/integration/test_partial_df_ranges.py \
            gelb/tests/integration/test_int_gauge_output.py \
            gelb/tests/integration/test_dot_prod_int_array.py \
            gelb/tests/integration/test_empty_node_class.py \
            gelb/tests/integration/test_int64_gauge_output.py \
            gelb/tests/integration/test_backend_cpu_fortran_serial.py \
            gelb/tests/unit \
            gelb/tests/numeric \
            -q

      - name: Build documentation with warnings as errors
        run: uv run sphinx-build -b html -W --keep-going docs /tmp/gelb-docs

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-gelb

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-gelb/package-lock.json

      - name: Install the extension's dependencies
        run: npm ci

      - name: Compile the extension
        run: npm run compile

      - name: Run the extension's tests
        run: npm test

      - name: Package the extension
        run: npx --yes @vscode/vsce@4.0.0 package --no-dependencies -o "$RUNNER_TEMP/gelb.vsix"
