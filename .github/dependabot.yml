# Dependency updates as one grouped pull request per ecosystem and month,
# so that CI (release-health.yml) checks each batch before it is merged.
# Security fixes for known advisories are opened as soon as they appear.
# Python updates move uv.lock only: the minimum versions in pyproject.toml
# stay where they are, so users with older packages can still install
# GeLB. The extension gets minor and patch updates; major versions
# (TypeScript, mocha, the TextMate engine, ...) are upgraded by hand.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    versioning-strategy: "lockfile-only"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/vscode-gelb"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @types/vscode must not be newer than engines.vscode in package.json
      # (vsce refuses to package otherwise); it moves when that minimum does.
      - dependency-name: "@types/vscode"
    groups:
      vscode-extension:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
