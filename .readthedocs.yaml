# ReadTheDocs build configuration for GeLB.
#
# This file is inert until the repo is imported into the ReadTheDocs
# dashboard (`readthedocs.org`). It is committed pre-launch so that
# the very first RTD build — triggered the moment the repo is
# connected — uses the known-good configuration rather than whatever
# RTD auto-detects. See https://docs.readthedocs.io/en/stable/config-file/v2.html.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    # Install the project itself (editable-equivalent) so that `import
    # gelb` succeeds during the build (conf.py reads the version from
    # the installed package).
    - method: pip
      path: .
    # Pull the docs-specific dependencies (sphinx theme, extensions)
    # from docs/requirements.txt.
    - requirements: docs/requirements.txt

formats:
  # HTML is the primary format; offer PDF + EPUB too since they're
  # nearly free once the HTML build works. Comment out either if the
  # build gets slow.
  - pdf
  - epub
