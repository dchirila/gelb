<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!--
    GeLB activity-bar icon: a 3×3 lattice of sites shown in a
    slight isometric perspective — the LBM visual signature, at
    24×24. Monochrome; the stroke colour is set to `currentColor`
    so VSCode themes can recolour it per state (active / inactive
    / hover). Connection lines drawn first so the dots overlay
    them at intersections; dots filled for contrast.
  -->
  <g stroke-width="1.2" stroke-opacity="0.65">
    <!-- horizontal rows -->
    <line x1="7"  y1="5"  x2="20" y2="5"/>
    <line x1="5"  y1="12" x2="18" y2="12"/>
    <line x1="3"  y1="19" x2="16" y2="19"/>
    <!-- vertical-ish columns (with the isometric skew) -->
    <line x1="7"  y1="5"  x2="3"  y2="19"/>
    <line x1="13" y1="5"  x2="9"  y2="19"/>
    <line x1="20" y1="5"  x2="16" y2="19"/>
  </g>
  <g fill="currentColor" stroke="none">
    <circle cx="7"  cy="5"  r="1.5"/>
    <circle cx="13" cy="5"  r="1.5"/>
    <circle cx="20" cy="5"  r="1.5"/>
    <circle cx="5"  cy="12" r="1.5"/>
    <circle cx="11" cy="12" r="1.5"/>
    <circle cx="18" cy="12" r="1.5"/>
    <circle cx="3"  cy="19" r="1.5"/>
    <circle cx="9"  cy="19" r="1.5"/>
    <circle cx="16" cy="19" r="1.5"/>
  </g>
</svg>
