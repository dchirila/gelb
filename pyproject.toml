[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gelb"
description = "GeLB is a domain-specific language for Lattice Boltzmann (LB/LBM) simulations."
authors = [
    { name = "Dragos B. Chirila" }
]
license = "MPL-2.0"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
    "antlr4-tools>=0.2.1",
    "click>=8.1.7",
    "colorama>=0.4.6",
    "Jinja2>=3.1.4",
    "numpy>=1.26.4",
    "sympy>=1.12",
    "matplotlib>=3.8.0",
    "netcdf4>=1.6.5",
    "scipy>=1.10",
]
dynamic = ["version"]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
]
docs = [
    "sphinx>=7.4.7",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2",
]
dev = [
    "pytest>=9.0.3",
    "setuptools>=70.0.0",
    "packaging>=24.0",
    "pluggy>=1.5.0",
    "iniconfig>=2.0.0",
    "install-jdk>=1.1.0",
    "MarkupSafe>=2.1.5",
    "docutils>=0.21.2",
    "pygments>=2.19.1",
    "watchdog>=6.0.0",
]

[project.scripts]
gelbc = "gelb.gelbc:cli"
gelb-view = "gelb.visualization.gelb_view:cli"

[tool.pytest.ini_options]
markers = [
    "gpu: tests requiring nvcc and NVIDIA GPU",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gelb*"]
exclude = ["gelb.tests*"]

[tool.setuptools.package-data]
"gelb.backends" = ["*.hpp", "*.cuh"]

[tool.setuptools.dynamic]
version = { attr = "gelb.__version__" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "setuptools>=70.0.0",
    "packaging>=24.0",
    "pluggy>=1.5.0",
    "iniconfig>=2.0.0",
    "install-jdk>=1.1.0",
    "MarkupSafe>=2.1.5",
    "docutils>=0.21.2",
    "pygments>=2.19.1",
    "watchdog>=6.0.0",
    "sphinx>=7.4.7",
    "rich>=15.0.0",
]
