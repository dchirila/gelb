[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gelb"
description = "GeLB is a domain-specific language for Lattice Boltzmann (LB/LBM) simulations."
authors = [
    { name = "Dragos B. Chirila" }
]
license = { text = "MPL-2.0" }
readme = "README.rst"
requires-python = ">=3.9"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
    "antlr4-tools>=0.2.1",
    "click>=8.1.7",
    "colorama>=0.4.6",
    "Jinja2>=3.1.4",
    "numpy>=1.26.4",
    "sympy>=1.12",
    "matplotlib>=3.8.0",
    "netcdf4>=1.6.5",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "setuptools>=70.0.0",
    "packaging>=24.0",
    "pluggy>=1.5.0",
    "iniconfig>=2.0.0",
    "install-jdk>=1.1.0",
    "MarkupSafe>=2.1.5",
    "docutils>=0.21.2",
    "pygments>=2.19.1",
    "watchdog>=6.0.0",
]

[project.scripts]
gelbc = "gelb.gelbc:cli"

[tool.setuptools]
packages = ["gelb"]

[tool.setuptools.dynamic]
version = { attr = "gelb.__version__" }

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.2",
    "setuptools>=70.0.0",
    "packaging>=24.0",
    "pluggy>=1.5.0",
    "iniconfig>=2.0.0",
    "install-jdk>=1.1.0",
    "MarkupSafe>=2.1.5",
    "docutils>=0.21.2",
    "pygments>=2.19.1",
    "watchdog>=6.0.0",
]